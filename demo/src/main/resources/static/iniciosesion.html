<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mentora inicio de sesión</title>
    <link rel="stylesheet" href="cssiniciosesion.css">
    <script src="mentora.js"></script>
</head>
<body>
    <main class="tarjeta">
        <header class="encabezado">
            <img src="logomentora.png" alt="Mentora" width="250" height="250">
        </header>

        <section aria-label="Iniciar sesión">

            <form id="formLogin">
                <div class="campo">
                    <label for="correo">Correo electrónico</label>
                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="contrasena">Contraseña</label>
                    <input
                        type="password"
                        id="contrasena"
                        name="contrasena"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" id="btnLogin" class="difuminado">Iniciar sesión</button>

                <p id="mensaje" class="mensaje" role="alert"></p>
            </form>

            <p class="crear-cuenta">¿No tienes cuenta? <a href="registro.html">Crear cuenta</a></p>
        </section>

        <footer>
            
        </footer>
    </main>

    <script>
        const formulario = document.getElementById("formLogin");
        const boton = document.getElementById("btnLogin");
        const mensaje = document.getElementById("mensaje");

        function mostrarMensaje(texto, clase) {
            mensaje.textContent = texto;
            mensaje.className = "mensaje " + clase;
        }

        // Si ya hay una sesión iniciada, no hace falta volver a entrar.
        obtenerSesion().then(function (sesion) {
            if (sesion) {
                window.location.replace("menu.html");
            }
        });

        formulario.addEventListener("submit", async function (evento) {

            evento.preventDefault();
            mostrarMensaje("", "");
            boton.disabled = true;

            try {
                const respuesta = await fetch("/login", {
                    method: "POST",
                    body: new URLSearchParams({
                        correo: document.getElementById("correo").value,
                        contrasena: document.getElementById("contrasena").value
                    })
                });

                if (respuesta.ok) {
                    window.location.href = "menu.html";
                    return;
                }

                // 404: no existe la cuenta. 401: contraseña incorrecta.
                mostrarMensaje(
                    await leerMensaje(
                        respuesta,
                        "No se pudo iniciar sesión. Inténtalo de nuevo."
                    ),
                    "error"
                );

            } catch (error) {
                mostrarMensaje(
                    "No se pudo conectar con el servidor.",
                    "error"
                );
                console.error(error);

            } finally {
                boton.disabled = false;
            }
        });
    </script>
</body>
</html>
