<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Buscar tutores | Mentora</title>

    <link rel="stylesheet" href="csstutores.css">
    <script src="mentora.js"></script>
</head>

<body>

    <main class="contenedor">

        <nav class="barra-nav">
            <a href="menu.html">← Volver al menú</a>

            <button type="button" id="btnSalir" class="boton-salir">
                Cerrar sesión
            </button>
        </nav>

        <header class="encabezado">
            <img
                src="logomentora.png"
                alt="Mentora"
                class="logo"
            >

            <h1>Encuentra tu tutor</h1>

            <p>
                Busca tutores según la materia en la que necesites apoyo
                o por el nombre del tutor.
            </p>
        </header>

        <section class="busqueda">

            <form id="formBusqueda">

                <label for="materia">
                    Materia o nombre del tutor
                </label>

                <div class="barra-busqueda">

                    <input
                        type="text"
                        id="materia"
                        name="materia"
                        placeholder="Ej. Matemática"
                    >

                    <button type="submit">
                        Buscar
                    </button>

                </div>

            </form>

        </section>

        <p id="mensaje" class="mensaje"></p>

        <section
            id="resultados"
            class="resultados"
            aria-live="polite">
        </section>

    </main>

    <script>
        const formulario = document.getElementById("formBusqueda");
        const campoBusqueda = document.getElementById("materia");
        const resultados = document.getElementById("resultados");
        const mensaje = document.getElementById("mensaje");

        // Evita que una respuesta lenta pise a una búsqueda más reciente.
        let numeroBusqueda = 0;

        async function buscar(texto) {

            const esta = ++numeroBusqueda;

            resultados.innerHTML = "";
            mensaje.textContent = "Buscando tutores...";

            try {

                const respuesta = await fetch(
                    "/tutores/buscar?q=" + encodeURIComponent(texto)
                );

                if (!respuesta.ok) {
                    throw new Error("No fue posible realizar la búsqueda.");
                }

                const tutores = await respuesta.json();

                if (esta !== numeroBusqueda) {
                    return;
                }

                if (tutores.length === 0) {
                    mensaje.textContent = texto
                        ? "No se encontraron tutores para \"" + texto + "\"."
                        : "Todavía no hay tutores registrados.";
                    return;
                }

                mensaje.textContent =
                    tutores.length +
                    (tutores.length === 1
                        ? " tutor encontrado"
                        : " tutores encontrados");

                tutores.forEach(function (tutor) {

                    const enlace = document.createElement("a");
                    enlace.className = "enlace-tarjeta";
                    enlace.href =
                        "perfil-tutor.html?id=" + encodeURIComponent(tutor.id);

                    const materias = Array.isArray(tutor.materias)
                            && tutor.materias.length > 0
                        ? tutor.materias
                            .map(function (materia) {
                                return materia.nombre;
                            })
                            .join(", ")
                        : "Sin materias registradas";

                    enlace.innerHTML = `
                        <article class="tarjeta-tutor">
                            <div class="avatar">
                                ${escaparHTML(obtenerInicial(tutor.nombre))}
                            </div>

                            <div class="informacion-tutor">
                                <h2>${escaparHTML(tutor.nombre)}</h2>

                                <p class="experiencia">
                                    ${escaparHTML(tutor.experiencia)}
                                </p>

                                <p>
                                    <strong>Materias:</strong>
                                    ${escaparHTML(materias)}
                                </p>

                                <p class="descripcion">
                                    ${escaparHTML(
                                        tutor.descripcion ||
                                        "Sin descripción"
                                    )}
                                </p>
                            </div>

                            <div class="precio">
                                <span>Precio por hora</span>
                                <strong>Q${Number(tutor.precio).toFixed(2)}</strong>
                                <span class="ver-perfil">Ver perfil →</span>
                            </div>
                        </article>
                    `;

                    resultados.appendChild(enlace);
                });

            } catch (error) {

                if (esta === numeroBusqueda) {
                    mensaje.textContent =
                        "Ocurrió un error al buscar los tutores.";
                }

                console.error(error);
            }
        }

        function obtenerInicial(nombre) {

            if (!nombre) {
                return "T";
            }

            return nombre.trim().charAt(0).toUpperCase();
        }

        formulario.addEventListener("submit", function (evento) {
            evento.preventDefault();
            buscar(campoBusqueda.value.trim());
        });

        document.getElementById("btnSalir")
            .addEventListener("click", cerrarSesion);

        // Página privada: exige sesión y muestra todos los tutores al entrar.
        exigirSesion().then(function (sesion) {
            if (sesion) {
                buscar("");
            }
        });
    </script>

</body>
</html>
