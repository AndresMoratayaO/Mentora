<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <!-- Permite que la página se adapte a celulares y tabletas -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Perfil del tutor | Mentora</title>

    <style>
        :root {
            --azul: #11105d;
            --azul-claro: #e9eafe;
            --verde: #20b99a;
            --verde-oscuro: #087b69;
            --texto: #172033;
            --texto-suave: #667085;
            --borde: #dddddd;
            --fondo: #f5f7fb;
            --blanco: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--texto);
            background-color: var(--fondo);
        }

        /* Barra superior */

        .barra-superior {
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 25px;
            padding: 10px 60px;
            background-color: var(--blanco);
            border-bottom: 1px solid var(--borde);
        }

        .marca {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--azul);
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
        }

        .marca img {
            width: 55px;
            height: 55px;
            object-fit: contain;
            border-radius: 50%;
        }

        .navegacion {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .navegacion a {
            color: var(--texto);
            font-weight: bold;
            text-decoration: none;
        }

        .navegacion a:hover {
            color: var(--verde-oscuro);
        }

        .navegacion .boton-iniciar {
            padding: 10px 18px;
            color: var(--azul);
            background-color: var(--blanco);
            border: 1px solid var(--azul);
            border-radius: 8px;
        }

        /* Contenedor principal */

        .contenedor {
            width: calc(100% - 40px);
            max-width: 1100px;
            margin: 30px auto 60px;
        }

        .volver {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--verde-oscuro);
            font-weight: bold;
            text-decoration: none;
        }

        /* Encabezado del perfil */

        .perfil-principal {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 280px;
            gap: 30px;
            padding: 35px;
            background-color: var(--blanco);
            border: 1px solid var(--borde);
            border-radius: 18px;
        }

        .informacion-tutor {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .foto-tutor {
            width: 125px;
            height: 125px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--blanco);
            background: linear-gradient(
                to right,
                var(--azul),
                var(--verde)
            );
            border-radius: 50%;
            font-size: 36px;
            font-weight: bold;
        }

        .datos-tutor h1 {
            margin: 0;
            color: var(--texto);
            font-size: 38px;
        }

        .verificado {
            display: inline-block;
            margin-top: 8px;
            padding: 5px 10px;
            color: var(--verde-oscuro);
            background-color: #dff8f1;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }
        .estado-disponible {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 12px 0 0;
            color: #087b69;
            font-size: 14px;
            font-weight: bold;
        }

        .punto-disponible {
            width: 10px;
            height: 10px;
            background-color: #20b99a;
            border-radius: 50%;
        }
        .especialidad {
            margin: 10px 0 2px;
            color: var(--verde-oscuro);
            font-size: 19px;
            font-weight: bold;
        }

        .ubicacion {
            margin: 0;
            color: var(--texto-suave);
        }

        .estadisticas {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 20px;
            margin-top: 18px;
            color: var(--texto-suave);
            font-size: 14px;
        }

        .estadisticas strong {
            color: var(--texto);
        }

        /* Reserva */

        .reserva {
            padding: 22px;
            border: 1px solid var(--borde);
            border-radius: 15px;
        }

        .precio {
            margin-top: 0;
        }

        .precio span {
            display: block;
            color: var(--texto-suave);
            font-size: 13px;
        }

        .precio strong {
            color: var(--azul);
            font-size: 28px;
        }

        .boton {
            width: 100%;
            display: block;
            margin-top: 10px;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
        }

        .boton-reservar {
            color: var(--blanco);
            background: linear-gradient(
                to right,
                var(--azul),
                var(--verde)
            );
            border: none;
        }

        .boton-contactar {
            color: var(--azul);
            background-color: var(--blanco);
            border: 1px solid var(--azul);
        }

        .boton:hover {
            filter: brightness(0.95);
        }

        .boton:focus,
        a:focus {
            outline: 3px solid #7de0cd;
            outline-offset: 3px;
        }

        .nota {
            color: var(--texto-suave);
            font-size: 12px;
            text-align: center;
        }

        /* Secciones inferiores */

        .contenido {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 30px;
            margin-top: 25px;
        }

        .columna-principal,
        .columna-lateral {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .tarjeta {
            padding: 28px;
            background-color: var(--blanco);
            border: 1px solid var(--borde);
            border-radius: 15px;
        }

        .tarjeta h2 {
            margin-top: 0;
            color: var(--azul);
            font-size: 21px;
        }

        .tarjeta p {
            line-height: 1.7;
        }

        /* Materias */

        .materias {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 0;
            list-style: none;
        }

        .materias li {
            padding: 7px 12px;
            color: var(--azul);
            background-color: var(--azul-claro);
            border-radius: 15px;
            font-size: 14px;
            font-weight: bold;
        }

        /* Metodología */

        .metodologia {
            padding: 0;
            list-style: none;
        }

        .metodologia li {
            margin-bottom: 12px;
            line-height: 1.6;
        }

        .metodologia li::before {
            content: "✓";
            margin-right: 10px;
            color: var(--verde-oscuro);
            font-weight: bold;
        }

        /* Formación */

        .formacion {
            margin-bottom: 18px;
        }

        .formacion strong {
            display: block;
        }

        .formacion span {
            color: var(--texto-suave);
            font-size: 14px;
        }

        /* Horarios */

        .horario {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-top: 10px;
            padding: 12px;
            background-color: var(--fondo);
            border-radius: 8px;
        }

        .horario strong {
            color: var(--azul);
        }

        footer {
            padding: 25px;
            color: var(--texto-suave);
            background-color: var(--blanco);
            border-top: 1px solid var(--borde);
            text-align: center;
        }

        /*
         * RESPONSIVE PARA TABLETAS
         */

        @media (max-width: 900px) {
            .barra-superior {
                padding: 10px 30px;
            }

            .perfil-principal {
                grid-template-columns: 1fr;
            }

            .reserva {
                width: 100%;
            }

            .contenido {
                grid-template-columns: 1fr;
            }

            .columna-lateral {
                display: grid;
                grid-template-columns: 1fr 1fr;
            }
        }

        /*
         * RESPONSIVE PARA CELULARES
         */

        @media (max-width: 600px) {
            .barra-superior {
                min-height: auto;
                padding: 12px 16px;
            }

            .marca {
                font-size: 20px;
            }

            .marca img {
                width: 45px;
                height: 45px;
            }

            .navegacion {
                gap: 10px;
            }

            .navegacion > a:not(.boton-iniciar) {
                display: none;
            }

            .navegacion .boton-iniciar {
                padding: 8px 12px;
                font-size: 13px;
            }

            .contenedor {
                width: calc(100% - 24px);
                margin-top: 20px;
            }

            .perfil-principal {
                padding: 24px 18px;
            }

            .informacion-tutor {
                flex-direction: column;
                align-items: flex-start;
            }

            .foto-tutor {
                width: 100px;
                height: 100px;
                font-size: 30px;
            }

            .datos-tutor h1 {
                font-size: 29px;
            }

            .estadisticas {
                flex-direction: column;
                gap: 8px;
            }

            .tarjeta {
                padding: 22px 18px;
            }

            .columna-lateral {
                display: flex;
            }

            .horario {
                flex-direction: column;
                gap: 4px;
            }

            footer {
                padding: 20px 15px;
                font-size: 13px;
            }
        }

        /* Añadidos para el perfil dinámico */

        [hidden] {
            display: none !important;
        }

        .navegacion button.boton-iniciar {
            font: inherit;
            font-weight: bold;
            cursor: pointer;
        }

        .estado-carga {
            padding: 30px;
            color: var(--texto-suave);
            background-color: var(--blanco);
            border: 1px solid var(--borde);
            border-radius: 15px;
            text-align: center;
        }

        .boton:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }
    </style>

    <script src="mentora.js"></script>
</head>

<body>

    <header class="barra-superior">

        <a href="menu.html" class="marca">
            <img
                src="logomentora.png"
                alt="Logo de Mentora"
            >

            <span>Mentora</span>
        </a>

        <nav class="navegacion">
            <a href="menu.html">Inicio</a>

            <button
                type="button"
                id="btnSalir"
                class="boton-iniciar"
            >
                Cerrar sesión
            </button>
        </nav>

    </header>

    <main class="contenedor">

        <a href="buscartutores.html" class="volver" id="enlaceVolver">
            ← Volver a tutores
        </a>

        <p id="estado" class="estado-carga">Cargando perfil...</p>

        <div id="perfil" hidden>

            <section class="perfil-principal">

                <div class="informacion-tutor">

                    <div class="foto-tutor" id="iniciales"></div>

                    <div class="datos-tutor">

                        <h1 id="nombre"></h1>

                        <p class="especialidad" id="especialidad"></p>

                    </div>
                </div>

                <aside class="reserva">

                    <p class="precio">
                        <span>Precio por hora</span>
                        <strong id="precio"></strong>
                    </p>

                    <button
                        type="button"
                        class="boton boton-contactar"
                        disabled
                        title="Disponible próximamente"
                    >
                        Contactar al tutor (próximamente)
                    </button>

                    <p class="nota">
                        No se realizará ningún cobro todavía.
                    </p>

                </aside>
            </section>

            <div class="contenido">

                <div class="columna-principal">

                    <section class="tarjeta">
                        <h2>Sobre mí</h2>

                        <p id="descripcion"></p>
                    </section>

                    <section class="tarjeta">
                        <h2>Materias que enseño</h2>

                        <ul class="materias" id="materias"></ul>
                    </section>

                    <section class="tarjeta">
                        <h2>Experiencia</h2>

                        <p id="experiencia"></p>
                    </section>

                </div>
            </div>

        </div>

    </main>

    <footer>
        © 2026 Mentora · Aprende con acompañamiento personalizado
    </footer>

    <script>
        const estado = document.getElementById("estado");
        const perfil = document.getElementById("perfil");

        function mostrarError(texto) {
            perfil.hidden = true;
            estado.hidden = false;
            estado.textContent = texto;
        }

        function obtenerIniciales(nombre) {

            const partes = (nombre || "").trim().split(/\s+/).filter(Boolean);

            if (partes.length === 0) {
                return "T";
            }

            return partes
                .slice(0, 2)
                .map(function (parte) {
                    return parte.charAt(0).toUpperCase();
                })
                .join("");
        }

        function mostrarTutor(tutor) {

            document.title = tutor.nombre + " | Mentora";

            document.getElementById("iniciales").textContent =
                obtenerIniciales(tutor.nombre);

            document.getElementById("nombre").textContent = tutor.nombre;

            const materias = Array.isArray(tutor.materias)
                ? tutor.materias
                : [];

            document.getElementById("especialidad").textContent =
                materias.length > 0
                    ? materias.map(function (m) { return m.nombre; }).join(" · ")
                    : "Sin materias registradas";

            document.getElementById("precio").textContent =
                "Q" + Number(tutor.precio).toFixed(2);

            document.getElementById("descripcion").textContent =
                tutor.descripcion ||
                "Este tutor todavía no ha agregado una descripción.";

            document.getElementById("experiencia").textContent =
                tutor.experiencia;

            const lista = document.getElementById("materias");
            lista.innerHTML = "";

            if (materias.length === 0) {
                const vacio = document.createElement("li");
                vacio.textContent = "Sin materias registradas";
                lista.appendChild(vacio);
            }

            materias.forEach(function (materia) {
                const item = document.createElement("li");
                item.textContent = materia.nombre;
                lista.appendChild(item);
            });

            estado.hidden = true;
            perfil.hidden = false;
        }

        async function iniciar() {

            const sesion = await exigirSesion();

            if (!sesion) {
                return;
            }

            // Un tutor que mira su propio perfil vuelve al menú, no a la búsqueda.
            if (sesion.tipoUsuario === "TUTOR") {
                const volver = document.getElementById("enlaceVolver");
                volver.href = "menu.html";
                volver.textContent = "← Volver al menú";
            }

            const id = new URLSearchParams(window.location.search).get("id");

            if (!id || !/^\d+$/.test(id)) {
                mostrarError("No se indicó qué tutor mostrar.");
                return;
            }

            try {
                const respuesta = await fetch("/tutores/" + id);

                if (respuesta.status === 404) {
                    mostrarError("No encontramos a este tutor.");
                    return;
                }

                if (!respuesta.ok) {
                    throw new Error("Error al cargar el perfil.");
                }

                mostrarTutor(await respuesta.json());

            } catch (error) {
                mostrarError("No se pudo cargar el perfil del tutor.");
                console.error(error);
            }
        }

        document.getElementById("btnSalir")
            .addEventListener("click", cerrarSesion);

        iniciar();
    </script>

</body>
</html>
